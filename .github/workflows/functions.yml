name: Deploy game server (Cloud Functions)

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'src/poule/config/**'
      - 'src/poule/domain/**'
      - 'src/poule/services/**'
      - 'src/poule/data/memory/**'
      - 'firestore.rules'
      - '.github/workflows/functions.yml'
  workflow_dispatch:

concurrency: functions-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_CREDENTIALS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - name: Waiting for the FIREBASE_SERVICE_ACCOUNT secret
        if: env.HAS_CREDENTIALS != 'true'
        run: echo "::warning::Add the FIREBASE_SERVICE_ACCOUNT secret to deploy the game server."
      - uses: actions/checkout@v4
        if: env.HAS_CREDENTIALS == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_CREDENTIALS == 'true'
        with:
          node-version: 22
      - name: Install
        if: env.HAS_CREDENTIALS == 'true'
        run: npm install --prefix functions --no-audit --no-fund
      - name: Bundle the server with the game's modules
        if: env.HAS_CREDENTIALS == 'true'
        run: npx --yes esbuild@0.24 functions/src/index.js --bundle --platform=node --target=node22 --format=esm --outfile=functions/lib/index.js --external:firebase-functions --external:firebase-admin
      - name: Credentials
        if: env.HAS_CREDENTIALS == 'true'
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: printf '%s' "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
      - name: Deploy functions and rules
        if: env.HAS_CREDENTIALS == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: npx --yes firebase-tools@13 deploy --only functions,firestore:rules --project la-poule-traverse --non-interactive --force
